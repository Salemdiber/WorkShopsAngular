<div class="container py-4">
    <h2 class="mb-3">Liste des événements</h2>

    <!-- Recherche -->
    <input type="text" class="form-control mb-4"
           placeholder="Rechercher"
           [(ngModel)]="searchTerm">

    <div class="row g-3">
        <div class="col-12 col-sm-6 col-md-4" *ngFor="let event of events | contains:searchTerm">
            <div class="card h-100 shadow-sm event-card">
                <img [src]="event.imageUrl"
                     class="card-img-top img-fluid"
                     alt="{{ event.titre }}"
                     style="height: 200px; object-fit: cover; border-top-left-radius: var(--border-radius); border-top-right-radius: var(--border-radius);">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" appHighlight>{{ event.titre | uppercase }}</h5>
                    <p class="text-muted mb-1">{{ event.description }}</p>
                    <div class="mb-2 small">
                        <span class="me-2"> {{ event.date | date:'mediumDate' }}</span>
                        <span> {{ event.lieu }}</span>
                    </div>
                    <div class="mb-2">
                        <span class="fw-bold text-primary">{{ event.prix | currency:'TND':'symbol':'1.3-3' }}</span>
                        <span class="ms-2">| Places: {{ event.nbplaces }}</span>
                    </div>
                    <div class="mt-auto d-flex align-items-center">
                        <button class="btn btn-sm btn-primary" (click)="increment_like(event)" [disabled]="isExpired(event)">
                            👍 
                        </button>
                        <span class="ms-2">{{ event.nbrLike }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
