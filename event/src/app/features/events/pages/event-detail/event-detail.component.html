<p>event-detail works!</p>

<div *ngIf="event">
  <h2>{{ event.titre }}</h2>
  <p>{{ event.description }}</p>
  <p>Date : {{ event.date }}</p>
  <p>Lieu : {{ event.lieu }}</p>
  <p>Prix : {{ event.prix }}</p>
  <img [src]="event.imageUrl" alt="{{ event.titre }}" style="max-width:300px;">
</div>
<div *ngIf="!event">
  <p>Événement non trouvé.</p>
</div>
